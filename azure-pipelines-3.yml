# Maven
# Build your Java project and run tests with Apache Maven.
# Add steps that analyze code, save build artifacts, deploy, and more:
# https://docs.microsoft.com/azure/devops/pipelines/languages/java

trigger: none
pr: none

pool:
  vmImage: ubuntu-latest

steps:
- task: Maven@3
  inputs:
    mavenPomFile: 'pom.xml'
    mavenOptions: '-Xmx3072m'
    javaHomeOption: 'JDKVersion'
    jdkVersionOption: '1.11'
    jdkArchitectureOption: 'x64'
    publishJUnitResults: true
    testResultsFiles: '**/surefire-reports/TEST-*.xml'
    goals: 'package'
- script: |
    echo "Finding WAR file..."
    find "$(Build.SourcesDirectory)" -name "*.war"

    echo "Copying WAR to Docker build context..."
    cp "$(Build.SourcesDirectory)/webapp/target/webapp.war" \
       "$(Build.SourcesDirectory)/webapp.war"

    echo "Files in Docker build context:"
    ls -la "$(Build.SourcesDirectory)"
  displayName: 'Prepare WAR for Docker'
- task: CopyFiles@2
  inputs:
    Contents: '**/*.war'
    TargetFolder: '$(build.artifactstagingdirectory)'
- task: PublishBuildArtifacts@1
  inputs:
    PathtoPublish: '$(Build.ArtifactStagingDirectory)'
    ArtifactName: 'drop'
    publishLocation: 'Container'
- task: Docker@2
  inputs:
    containerRegistry: 'DockerHUB'
    command: 'login'
- task: Docker@2
  inputs:
    containerRegistry: 'DockerHUB'
    repository: 'dsunkari/tomcat'
    command: 'buildAndPush'
    Dockerfile: '**/Dockerfile'
