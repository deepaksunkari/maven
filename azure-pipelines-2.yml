trigger: none
pr: none

pool:
  name: LocalMachine

steps:
- task: Maven@3
  displayName: 'Build Java Application'
  inputs:
    mavenPomFile: 'pom.xml'
    goals: 'package'
    mavenOptions: '-Xmx3072m'
    # Configured to use your custom OpenJDK 21 path
    javaHomeOption: 'Path'
    jdkDirectory: '/usr/lib/jvm/java-21-openjdk-amd64'
    jdkArchitectureOption: 'x64'
    mavenVersionOption: 'Default'
    publishJUnitResults: true
    testResultsFiles: '**/surefire-reports/TEST-*.xml'

- task: PublishPipelineArtifact@1
  displayName: 'Publish Build Artifacts'
  inputs:
    targetPath: '$(System.DefaultWorkingDirectory)/target'
    artifact: 'webapp'

- script: |
    ls -l target
  displayName: 'Verify Artifact'