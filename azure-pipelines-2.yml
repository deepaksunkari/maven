trigger: none

pr: none

pool:
  name: CorpMachine

steps:

# 1. Build Application
- task: Maven@3
  displayName: 'Build Java Application'
  inputs:
    mavenPomFile: 'pom.xml'
    goals: 'package'
    mavenOptions: '-Xmx3072m'
    javaHomeOption: 'JDKVersion'
    jdkVersionOption: 'default'
    mavenVersionOption: 'Default'
    publishJUnitResults: true
    testResultsFiles: '**/surefire-reports/TEST-*.xml'

# 2. Stage WAR File
- task: CopyFiles@2
  displayName: 'Stage WAR File'
  inputs:
    Contents: '**/*.war'
    TargetFolder: '$(Build.ArtifactStagingDirectory)'

# 3. Diagnostics
- powershell: |
    Write-Host "========== DIAGNOSTICS =========="

    Write-Host "`nRunning as:"
    whoami

    Write-Host "`nDesktop Path Exists?"
    Test-Path "C:\Tomcat\webapps"

    Write-Host "`nListing Desktop Folder..."
    Get-ChildItem "C:\Tomcat\webapps" -ErrorAction Continue

    Write-Host "`nSearching for WAR files..."
    Get-ChildItem "$(System.DefaultWorkingDirectory)" -Recurse -Filter *.war

  displayName: 'Diagnostics'

# 4. Deploy WAR to Tomcat
- powershell: |

    Write-Host ""
    Write-Host "1. CLEANING OLD DEPLOYMENTS TO PREVENT CACHING..."

    $targetDir = "C:\Tomcat\webapps"

    if (Test-Path "$targetDir\webapp.war") {
        Remove-Item "$targetDir\webapp.war" -Force
        Write-Host "Removed old WAR"
    }

    if (Test-Path "$targetDir\webapp") {
        Remove-Item "$targetDir\webapp" -Recurse -Force
        Write-Host "Removed exploded webapp folder"
    }

    Write-Host ""
    Write-Host "2. LOCATING GENERATED WAR FILE..."

    $warFile = Get-ChildItem "$(System.DefaultWorkingDirectory)" `
        -Recurse `
        -Filter *.war | Select-Object -First 1

    if (-not $warFile) {
        Write-Host "ERROR: No WAR file found."
        exit 1
    }

    Write-Host "WAR Found:"
    Write-Host $warFile.FullName

    if (-not (Test-Path $targetDir)) {
        New-Item -Path $targetDir -ItemType Directory -Force
    }

    Write-Host ""
    Write-Host "3. COPYING WAR TO TOMCAT..."

    Copy-Item `
        -Path $warFile.FullName `
        -Destination "$targetDir\webapp.war" `
        -Force

    Write-Host ""
    Write-Host "4. VERIFYING DEPLOYMENT..."

    if (Test-Path "$targetDir\webapp.war") {
        Write-Host "SUCCESS: webapp.war deployed successfully."
        Get-Item "$targetDir\webapp.war"
    }
    else {
        Write-Host "ERROR: Deployment failed."
        exit 1
    }

  displayName: 'Clean Deploy WAR to Local Windows Tomcat'