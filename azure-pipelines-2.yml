trigger: none
pr: none

pool:
  name: CorpMachine

steps:
# 1. Build the Application
- task: Maven@3
  displayName: 'Build Java Application'
  inputs:
    mavenPomFile: 'pom.xml'
    goals: 'package'
    mavenOptions: '-Xmx3072m'
    # Instructs the task to grab the native system configurations we just mapped
    javaHomeOption: 'JDKVersion'
    jdkVersionOption: 'default'
    mavenVersionOption: 'Default'
    publishJUnitResults: true
    testResultsFiles: '**/surefire-reports/TEST-*.xml'
- task: CopyFiles@2
  displayName: 'Staging WAR File'
  inputs:
    Contents: '**/*.war'
    TargetFolder: '$(Build.ArtifactStagingDirectory)'

- powershell: |
    Write-Host "========================================="
    Write-Host "1. CLEANING OLD DEPLOYMENTS TO PREVENT CACHING..."
    $targetDir  = "C:\Program Files\Tomcat\webapps"
    
    # Forcefully delete old war and unpacked folder if they exist
    if (Test-Path "$targetDir\webapp.war") { Remove-Item "$targetDir\webapp.war" -Force }
    if (Test-Path "$targetDir\webapp") { Remove-Item "$targetDir\webapp" -Recurse -Force }

    Write-Host "========================================="
    Write-Host "2. DEPLOYING FRESH WAR FILE TO TOMCAT..."
    $sourcePath = "$(System.DefaultWorkingDirectory)\webapp\target\webapp.war"
    
    if (-not (Test-Path $targetDir)) {
        New-Item -ItemType Directory -Force -Path $targetDir
    }
    
    Copy-Item -Path $sourcePath -Destination $targetDir -Force

    Write-Host "========================================="
    Write-Host "3. VERIFYING TOMCAT DEPLOYMENT LOCATION:"
    if (Test-Path "$targetDir\webapp.war") {
        Write-Host "SUCCESS: Fresh webapp.war successfully deployed!"
        Get-ChildItem "$targetDir\webapp.war"
    } else {
        Write-Host "ERROR: Deployment failed!"
        exit 1
    }
  displayName: 'Clean and Deploy WAR to Local Windows Tomcat'