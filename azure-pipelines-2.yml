trigger: none
pr: none

pool:
  name: CorpMachine

steps:
# 1. Build the Application
- task: Maven@3
  displayName: 'Build Java Application'
  inputs:
    mavenPomFile: 'pom.xml'
    goals: 'package'
    mavenOptions: '-Xmx3072m'
    # Instructs the task to grab the native system configurations we just mapped
    javaHomeOption: 'JDKVersion'
    jdkVersionOption: 'default'
    mavenVersionOption: 'Default'
    publishJUnitResults: true
    testResultsFiles: '**/surefire-reports/TEST-*.xml'
- task: CopyFiles@2
  displayName: 'Staging WAR File'
  inputs:
    Contents: '**/*.war'
    TargetFolder: '$(Build.ArtifactStagingDirectory)'
- task: PublishBuildArtifacts@1
  inputs:
    PathtoPublish: '$(Build.ArtifactStagingDirectory)'
    ArtifactName: 'localWebapp'
    publishLocation: 'Container'
- powershell: |
    Write-Host "========================================="
    Write-Host "1. DEPLOYING WAR FILE TO TOMCAT CONTAINER..."
    
    $sourcePath = "$(System.DefaultWorkingDirectory)\webapp\target\webapp.war"
    $targetDir  = "C:\Program Files\Tomcat\webapps"
    
    # Check if the target webapps directory exists, create it if missing
    if (-not (Test-Path $targetDir)) {
        New-Item -ItemType Directory -Force -Path $targetDir
    }
    
    # Copy the fresh war file directly over to your Windows Tomcat folder
    Copy-Item -Path $sourcePath -Destination $targetDir -Force

    Write-Host "========================================="
    Write-Host "2. VERIFYING TOMCAT DEPLOYMENT LOCATION:"
    
    if (Test-Path "$targetDir\webapp.war") {
        Write-Host "SUCCESS: webapp.war successfully deployed to $targetDir"
        Get-ChildItem "$targetDir\webapp.war"
    } else {
        Write-Host "ERROR: webapp.war file was not found in the target directory!"
        exit 1
    }
  displayName: 'Deploy WAR to Local Windows Tomcat'

