trigger: none
pr: none

pool:
  name: LocalMachine

steps:
- task: Maven@3
  displayName: 'Build Java Application'
  inputs:
    mavenPomFile: 'pom.xml'
    goals: 'package'
    mavenOptions: '-Xmx3072m'
    # Configured to use your custom OpenJDK 21 path
    javaHomeOption: 'Path'
    jdkDirectory: '/usr/lib/jvm/java-21-openjdk-amd64'
    jdkArchitectureOption: 'x64'
    mavenVersionOption: 'Default'
    publishJUnitResults: true
    testResultsFiles: '**/surefire-reports/TEST-*.xml'

# Verification script (moved BEFORE publishing so you can debug the file layout)
- script: |
    echo "=== Checking contents of webapp/target ==="
    ls -l webapp/target
  displayName: 'Verify Artifact Location'

# Inside your Build Job steps:
- task: Maven@3
  inputs:
    mavenPomFile: 'pom.xml'
    goals: 'package'
    # ... your other settings ...

- task: PublishPipelineArtifact@1
  displayName: 'Upload War File'
  inputs:
    targetPath: '$(System.DefaultWorkingDirectory)/webapp/target/webapp.war'
    artifact: 'webapp'
    publishLocation: 'pipeline'

