trigger:
- master

stages:

- stage: Build
  jobs:
  - job: Build
    pool:
      vmImage: ubuntu-latest

    steps:

    - task: Maven@3
      inputs:
        mavenPomFile: 'pom.xml'
        mavenOptions: '-Xmx3072m'
        javaHomeOption: 'JDKVersion'
        jdkVersionOption: '1.11'
        jdkArchitectureOption: 'x64'
        publishJUnitResults: true
        testResultsFiles: '**/surefire-reports/TEST-*.xml'
        goals: 'package'

    - task: CopyFiles@2
      inputs:
        SourceFolder: '$(Build.SourcesDirectory)'
        Contents: '**/*.war'
        TargetFolder: '$(Build.ArtifactStagingDirectory)'

    - task: PublishBuildArtifacts@1
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)'
        ArtifactName: 'java-war-file'
        publishLocation: 'Container'

- stage: Deploy
  dependsOn: Build

  jobs:
  - deployment: DeployToVM
    displayName: Deploy WAR to Tomcat VM
    environment: java_webapp

    strategy:
      runOnce:
        deploy:
          steps:

          # Download artifact generated in Build stage
          - download: current
            artifact: java-war-file

          # Run on the target Windows VM
          - task: PowerShell@2
            displayName: Deploy WAR to Tomcat
            inputs:
              targetType: inline
              script: |

                Write-Host "=== Running on VM ==="
                hostname
                Write-Host $env:COMPUTERNAME

                # Show downloaded files
                Get-ChildItem -Path "$(Pipeline.Workspace)" -Recurse

                # Locate WAR file
                $war = Get-ChildItem `
                  -Path "$(Pipeline.Workspace)" `
                  -Filter *.war `
                  -Recurse |
                  Select-Object -First 1

                if (-not $war) {
                    throw "WAR file not found"
                }

                Write-Host "WAR Found: $($war.FullName)"

                # Tomcat deployment directory
                $TomcatWebApps = "C:\Users\sunkari\Downloads\apache-tomcat-9.0.121-windows-x64\apache-tomcat-9.0.121\webapps"

                # Copy WAR
                Copy-Item $war.FullName `
                  -Destination "$TomcatWebApps\webapp.war" `
                  -Force

                Write-Host "WAR copied successfully"

                # Optional: Restart Tomcat service if installed as a service
                $service = Get-Service | Where-Object {$_.Name -like "*Tomcat*"}

                if ($service) {
                    Restart-Service $service.Name -Force
                    Write-Host "Tomcat service restarted"
                }